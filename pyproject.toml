[project]
name = "valo-player-intel"
version = "0.1.0"
description = "VALORANT Player Intelligence: cohort-aware segmentation and win probability modeling."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "dote" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "plotly>=6.0",
  "streamlit>=1.43",
  "pydantic>=2.10",
  "PyYAML>=6.0.2",
  "requests>=2.32",
  "tenacity>=9.0",
  "vlrdevapi>=1.6.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]
torch = [
  "torch>=2.5,<2.7; python_version < '3.14'",
]

[project.scripts]
valo-player-intel = "valo_player_intel.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
